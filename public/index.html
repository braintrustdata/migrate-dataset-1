<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>AI Assistant</h1>
        <button id="new-chat-btn" class="btn-primary">+ New Chat</button>
      </div>
      <div id="conversation-list" class="conversation-list"></div>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="btn-secondary">Toggle Theme</button>
      </div>
    </aside>

    <main class="chat-area">
      <div class="chat-header">
        <button id="sidebar-toggle" class="btn-icon sidebar-toggle">&#9776;</button>
        <h2 id="chat-title" class="chat-title">Select a conversation</h2>
        <input type="text" id="title-edit-input" class="title-input" style="display:none">
        <div class="chat-actions">
          <button id="settings-btn" class="btn-icon" title="Settings" style="display:none">&#9881;</button>
          <button id="delete-chat-btn" class="btn-icon btn-danger" title="Delete conversation" style="display:none">&#128465;</button>
        </div>
      </div>

      <div id="messages" class="messages">
        <div class="empty-state">
          <p>Start a new conversation or select one from the sidebar.</p>
        </div>
      </div>

      <div class="input-area" id="input-area" style="display:none">
        <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
        <button id="send-btn" class="btn-primary">Send</button>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal" style="display:none">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Conversation Settings</h3>
        <button id="close-settings" class="btn-icon">&times;</button>
      </div>
      <div class="modal-body">
        <label for="system-prompt">System Prompt</label>
        <textarea id="system-prompt" rows="4" placeholder="You are a helpful assistant."></textarea>
        <label for="model-select">Model</label>
        <select id="model-select">
          <option value="mock">Mock (Built-in)</option>
        </select>
      </div>
      <div class="modal-footer">
        <button id="save-settings" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
