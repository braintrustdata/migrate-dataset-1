<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload — VidLocal</title>
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <header class="header">
    <a href="/" class="header-logo">
      <svg viewBox="0 0 90 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="20" rx="4" fill="#FF0000"/>
        <polygon points="11,5 11,15 21,10" fill="white"/>
      </svg>
      <span>VidLocal</span>
    </a>
  </header>

  <div class="page-body">
    <main class="upload-layout">
      <h1>Upload Video</h1>

      <div class="error-msg" id="errorMsg" role="alert"></div>
      <div class="success-msg" id="successMsg" role="status"></div>

      <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="Select video file">
        <div class="drop-zone-icon">📹</div>
        <strong>Drag &amp; drop a video here</strong>
        <p>or click to browse files</p>
        <p style="margin-top:8px;font-size:12px;">MP4, WebM, OGG, MOV supported</p>
        <input type="file" id="fileInput" name="file" accept="video/*" style="display:none" />
      </div>

      <div class="file-preview" id="filePreview" style="display:none">
        <video id="previewPlayer" controls muted style="width:100%;max-height:240px;border-radius:6px;margin-bottom:10px;"></video>
        <div class="file-preview-info">
          <strong id="previewFileName"></strong>
          <span id="previewFileSize" style="margin-left:12px;color:#aaa;"></span>
        </div>
      </div>

      <form id="uploadForm" novalidate>
        <div class="form-group">
          <label for="uploadTitle">Title <span style="color:#ff4444">*</span></label>
          <input type="text" id="uploadTitle" name="title" placeholder="Enter video title" maxlength="200" required />
        </div>

        <div class="form-group">
          <label for="uploadDescription">Description</label>
          <textarea id="uploadDescription" name="description" placeholder="Tell viewers about your video" maxlength="5000"></textarea>
        </div>

        <div class="form-group">
          <label for="uploadTags">Tags</label>
          <input type="text" id="uploadTags" name="tags" placeholder="gaming, tutorial, fun (comma-separated)" />
        </div>

        <div class="form-group">
          <label for="uploaderName">Channel Name <span style="color:#ff4444">*</span></label>
          <input type="text" id="uploaderName" name="uploaderName" placeholder="Your channel name" maxlength="60" required />
        </div>

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText" style="display:none"></div>

        <button type="submit" class="upload-btn" id="uploadBtn" disabled>
          Select a video file first
        </button>
      </form>
    </main>
  </div>

  <script type="module" src="/js/upload.js"></script>
</body>
</html>
